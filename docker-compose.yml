version: '3.9'

services:
  db:
    image: mysql:8.4
    container_name: heis_suite_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: heis_suite_db
    ports:
      - "3306:3306"
    volumes:
      - heis_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  heis-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: heis_suite_unified_app
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: heis_suite_db
      DB_USER: root
      DB_PASS: rootpassword
      JWT_SECRET: heis_suite_super_secure_jwt_token_key_2026_enterprise_saas
      CLIENT_URL: http://localhost:80
    ports:
      - "80:4000"
      - "4000:4000"

volumes:
  heis_mysql_data:
