# docker-compose.prod.yml
name: heis-suite-prod

services:
  # ==========================================
  # 1. REVERSE PROXY & FRONTEND (Nginx + TLS)
  # ==========================================
  nginx:
    build:
      context: .
      dockerfile: apps/shell/Dockerfile
      args:
        VITE_API_URL: /api
    image: ghcr.io/grupoheis-sac/heis-suite-web:${IMAGE_TAG:-latest}
    container_name: heis_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.prod.conf:/etc/nginx/conf.d/heis-suite.conf:ro
      - certbot_etc:/etc/letsencrypt:ro
      - certbot_var:/var/www/certbot:ro
    depends_on:
      server:
        condition: service_healthy
    networks:
      - frontend_net
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
        reservations:
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # ==========================================
  # 2. RENOVADOR AUTOMÁTICO SSL LET'S ENCRYPT
  # ==========================================
  certbot:
    image: certbot/certbot:latest
    container_name: heis_certbot
    restart: unless-stopped
    volumes:
      - certbot_etc:/etc/letsencrypt
      - certbot_var:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done;'"
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  # ==========================================
  # 3. BACKEND API, MOTOR SUNAT & WEBSOCKETS
  # ==========================================
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: ghcr.io/grupoheis-sac/heis-suite-api:${IMAGE_TAG:-latest}
    container_name: heis_server
    restart: always
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      TZ: America/Lima
      PORT: 4000
      DB_HOST: mysql
      DB_PORT: 3306
      REDIS_URL: redis://:${REDIS_PASSWORD:-heis_redis_pass_2026}@redis:6379
    volumes:
      - heis_certs:/app/server/certs
      - heis_storage:/app/server/storage
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - frontend_net
      - backend_net
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1024M
        reservations:
          memory: 384M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "7"

  # ==========================================
  # 4. BASE DE DATOS TRANSACCIONAL MYSQL 8.0
  # ==========================================
  mysql:
    image: mysql:8.0
    container_name: heis_mysql
    restart: always
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=-05:00
      - --max-connections=250
      - --innodb-buffer-pool-size=1G
      - --innodb-log-file-size=256M
      - --innodb-flush-log-at-trx-commit=1
      - --sync-binlog=1
      - --transaction-isolation=READ-COMMITTED
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS:-root_heis_secure_2026}
      MYSQL_DATABASE: ${DB_NAME:-heis_suite_db}
      MYSQL_USER: ${DB_USER:-heis_user}
      MYSQL_PASSWORD: ${DB_PASS:-heis_db_secure_pass_2026}
      TZ: America/Lima
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - backend_net
    oom_score_adj: -500 # Protege a MySQL frente al OOM Killer del Kernel
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
        reservations:
          memory: 1024M
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$$MYSQL_USER -p$$MYSQL_PASSWORD || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ==========================================
  # 5. REDIS 7 (SOCKET.IO ADAPTER & RATE LIMIT)
  # ==========================================
  redis:
    image: redis:7.2-alpine
    container_name: heis_redis
    restart: always
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-heis_redis_pass_2026}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - backend_net
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 320M
        reservations:
          memory: 64M
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-heis_redis_pass_2026} ping | grep PONG"]
      interval: 15s
      timeout: 5s
      retries: 5

networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge
    internal: true # Aísla MySQL y Redis de acceso directo externo

volumes:
  mysql_data:
  redis_data:
  heis_certs:
  heis_storage:
  certbot_etc:
  certbot_var:
