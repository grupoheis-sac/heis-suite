# nginx.prod.conf
upstream heis_backend {
    server server:4000;
    keepalive 32;
}

# Mapa para manejar el Upgrade de conexiones WebSocket (Socket.io KDS y Salón)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 1. Servidor HTTP (Puerto 80): Challenge de Let's Encrypt, healthcheck y redirección HTTPS
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name suite.grupoheis.com _;
    server_tokens off;

    location = /nginx-health {
        access_log off;
        return 200 "OK\n";
    }

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Servidor HTTPS (Puerto 443): Producción con HTTP/2
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name suite.grupoheis.com;
    server_tokens off;

    # Certificados Let's Encrypt
    ssl_certificate /etc/letsencrypt/live/suite.grupoheis.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/suite.grupoheis.com/privkey.pem;

    # Hardening TLS moderno
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Cabeceras de Seguridad DevSecOps
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Compresión Gzip para JSON y bundles JS/CSS
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml font/woff2;

    # Límite para subida de certificados .pfx o importación de Excel de Medicamentos/Clientes
    client_max_body_size 10M;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy API Backend Node.js
    location /api/ {
        proxy_pass http://heis_backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 35s; # Margen superior al timeout SOAP SUNAT de 12s
        proxy_send_timeout 35s;
    }

    # Proxy directo a /health
    location = /health {
        proxy_pass http://heis_backend/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Proxy WebSockets (Socket.io para KDS Cocina, Mesas y Alertas SUNAT)
    location /socket.io/ {
        proxy_pass http://heis_backend/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_buffering off;
    }

    # Caché inmutable para fuentes WOFF2 y assets con hash de Vite
    location ~* \.(?:js|css|woff2|png|jpg|jpeg|gif|ico|svg)$ {
        expires 365d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Soporte de rutas para React SPA (apps/shell)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}
